services:
  - type: web
    name: m00932446-after-school
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: afterclass
      - key: ALLOWED_ORIGINS
        value: https://zibawaa.github.io
